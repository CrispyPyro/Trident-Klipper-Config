# Pause uses Mainsail's saved resume state and guarded parking helpers.
# The local guard preserves the first pause if PAUSE is sent more than once.
[gcode_macro PAUSE]
description: Pause once, park, and cool the nozzle unless KEEP_HEAT=1
rename_existing: PAUSE_BASE
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
        {% set temp = printer.extruder.target %}
        {% set restore = params.RESTORE|default(1)|int == 1 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
        {% if client.idle_timeout|default(0)|int > 0 %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
            SET_IDLE_TIMEOUT TIMEOUT={client.idle_timeout}
        {% endif %}
        PAUSE_BASE
        _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
        {% if params.KEEP_HEAT|default(0)|int == 0 %}
            {client.user_pause_macro|default("")}
        {% endif %}
    {% endif %}

[gcode_macro _PAUSE_COOL_DOWN]
description: Keep the saved target for Mainsail RESUME while cooling the nozzle
gcode:
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    M104 S0

[gcode_macro M600]
description: Pause for filament change at the front left, keeping the nozzle hot
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set z = params.Z|default(10)|float %}
        {% set z_min = printer.gcode_move.gcode_position.z + [z, 0]|max + 25 %}
        PAUSE X={printer.toolhead.axis_maximum.x / 4} Y={printer.toolhead.axis_minimum.y + 1} Z_MIN={z_min} KEEP_HEAT=1
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel with heater shutdown before optional end-of-print moves
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    CANCEL_PRINT_BASE
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': False, 'temp': 0}}"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE=0
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    PRINT_END

# Compatibility for existing heat-soak macros that call the old builtin aliases.
[gcode_macro BASE_PAUSE]
gcode:
    PAUSE_BASE {rawparams}

[gcode_macro BASE_RESUME]
gcode:
    RESUME_BASE {rawparams}

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}


[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

